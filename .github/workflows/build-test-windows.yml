name: Build & Test Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure (CMake preset: native)
        run: cmake --preset native

      - name: Build (CMake preset: native)
        run: cmake --build --preset native --config Release

      - name: Run Cherry test suite
        shell: bash
        run: |
          EXE="build/Release/Cherry.exe"
          if [ ! -f "$EXE" ]; then
            EXE="build/Cherry.exe"
          fi
          python scripts/run_cherry_tests.py --exe "$EXE"
