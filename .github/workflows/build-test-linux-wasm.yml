name: Build & Test Linux (WASM)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-linux-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Configure (CMake preset: wasm)
        run: cmake --preset wasm

      - name: Build (CMake preset: wasm)
        run: cmake --build --preset wasm --config Release

      - name: WASM smoke test
        shell: bash
        run: |
          JS_PATH="build-wasm/Cherry.js"
          if [ ! -f "$JS_PATH" ]; then
            JS_PATH="build-wasm/Release/Cherry.js"
          fi
          if [ ! -f "$JS_PATH" ]; then
            echo "Cherry.js not found in build-wasm or build-wasm/Release."
            exit 1
          fi
          cat > .github/workflows/.tmp-wasm-smoke.js <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const jsPath = process.argv[2];
          const source = fs.readFileSync("test/cases/success/basic_arith.chry", "utf8");
          global.Module = {
            noInitialRun: true,
            preRun: [() => {
              FS.writeFile("/input.chry", source);
            }],
            onRuntimeInitialized: () => {
              try {
                Module.callMain(["/input.chry"]);
                process.exit(0);
              } catch (err) {
                console.error(err);
                process.exit(1);
              }
            }
          };
          require(path.resolve(jsPath));
          EOF
          node .github/workflows/.tmp-wasm-smoke.js "$JS_PATH"
