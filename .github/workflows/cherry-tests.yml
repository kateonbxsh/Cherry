name: Cherry Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run test suite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE="build/Release/Cherry.exe"
            if [ ! -f "$EXE" ]; then EXE="build/Cherry.exe"; fi
          else
            EXE="build/Cherry"
          fi
          python scripts/run_cherry_tests.py --exe "$EXE"
